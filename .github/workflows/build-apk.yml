name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Sankalp_IP_HRMS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sankalp_IP_HRMS_APK
          path: Sankalp_IP_HRMS.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk-${{ github.run_number }}
          name: Sankalp IP HRMS Android App v1.0.0
          body: |
            ### Sankalp IP - HRMS Android Application
            Download and install the APK directly on your Android phone.
            - File: `Sankalp_IP_HRMS.apk`
            - Built with Capacitor & React
          files: Sankalp_IP_HRMS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
